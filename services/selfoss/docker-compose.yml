version: "3"

services:
  selfoss:
    image: docker.io/rsprta/selfoss
    container_name: selfoss
    restart: always
    ports:
      - ${PORT_SELFOSS}:8888
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      VIRTUAL_PORT: 8888
      CRON_PERIOD: 60m
    volumes:
      - ${CONFIG_DIR}/selfoss:/selfoss/data
    healthcheck:
      test: wget -q --spider 127.0.0.1:8888/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
